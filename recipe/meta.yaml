{% set version = "0.3.1" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-clinify
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/clinify_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/clinify/clinify_{{ version }}.tar.gz
  sha256: 1dec0c488599bcbb1d7995c9b83f58f6f0a92cd8e5aa9913e7a040eb5c549d2d

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-dplyr
    - r-flextable
    - r-htmltools
    - r-knitr
    - r-magrittr
    - r-officer >=0.7.2
    - r-tidyselect
    - r-zoo
  run:
    - r-base
    - r-dplyr
    - r-flextable
    - r-htmltools
    - r-knitr
    - r-magrittr
    - r-officer >=0.7.2
    - r-tidyselect
    - r-zoo

test:
  commands:
    - $R -e "library('clinify')"           # [not win]
    - "\"%R%\" -e \"library('clinify')\""  # [win]

about:
  home: https://atorus-research.github.io/clinify/
  license: Apache-2.0
  summary: The primary motivation of this package is to take the things that are great about the R packages 'flextable' <https://davidgohel.github.io/flextable/> and 'officer' <https://davidgohel.github.io/officer/>, take the standard and complex pieces of formatting clinical tables for regulatory use, and simplify the
    tedious pieces.
  license_family: APACHE
  license_file:
    - LICENSE-2.0.txt

extra:
  recipe-maintainers:
    - conda-forge/r
